# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Python requirements for building documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    # Sphinx, the theme and the iframe extension. The package itself is not installed:
    # docs/conf.py puts the checkout on sys.path and mocks the OpenEye toolkits, which are
    # not on PyPI, so a pip install of the package cannot succeed on Read the Docs.
    - requirements: docs/requirements.txt